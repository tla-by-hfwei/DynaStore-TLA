\* TLC Model Configuration for DynaStore
\* Small model for verification

\* Process identifiers
CONSTANT 
    Procs = {p1, p2}

\* Values that can be written
CONSTANT 
    Values = {v1}

\* Initial view: both processes are initially in the system
CONSTANT
    Init = {[type |-> "Add", proc |-> p1], [type |-> "Add", proc |-> p2]}

\* Maximum number of changes (limits view space)
CONSTANT
    MaxChanges = 3

\* Symmetry sets for optimization
SYMMETRY
    Procs
    Values

\* State constraint to limit exploration
CONSTRAINT
    /\ Len(history) <= 8
    /\ Cardinality(msgs) <= 15

\* Specification to check
SPECIFICATION Spec

\* Invariants to verify
INVARIANTS
    TypeOK
    ViewContainsInit
    TimestampMonotonicity

\* Check for deadlocks
CHECK_DEADLOCK TRUE
